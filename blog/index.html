<script>
    document.addEventListener("DOMContentLoaded", function() {
        const hamburgerWrapper = document.querySelector(".hamburger-wrapper");
        const hamburgerMenu = document.querySelector(".hamburger-menu");

        // Ensure dropdown starts closed
        hamburgerWrapper.classList.remove("active");

        // Toggle dropdown on hamburger click
        hamburgerMenu.addEventListener("click", function(e) {
            e.stopPropagation(); // prevent the click from closing immediately
            hamburgerWrapper.classList.toggle("active");
        });

        // Close dropdown when clicking anywhere outside
        document.addEventListener("click", function(e) {
            if (!hamburgerWrapper.contains(e.target)) {
                hamburgerWrapper.classList.remove("active");
            }
        });
    });



// Sidebar toggle functionality for mobile view
        const sidebar = document.querySelector(".blog-sidebar");
        const sidebarToggle = document.querySelector(".sidebar-toggle");

        // Ensure the sidebar starts collapsed
        sidebar.classList.remove("open");

        // Toggle the sidebar on mobile
        sidebarToggle.addEventListener("click", function() {
            sidebar.classList.toggle("open");
            sidebarToggle.classList.toggle("open");
            sidebarToggle.innerHTML = sidebar.classList.contains("open") ? "&lt;" : "&gt;";
        });

        fetch('posts.json')
    .then(response => response.json())
    .then(data => {
        // Get the most recent post
        const mostRecentPost = data[0]; // Assuming posts are sorted by date in the JSON








// Fetch the HTML content of the post (the entire HTML file at the URL in the JSON)
fetch(mostRecentPost.url)  // URL from JSON (e.g., 'gear_reviews/fuji_x100vi/index.html')
    .then(postResponse => postResponse.text())  // Get the HTML content as text
    .then(postHTML => {
        // Create a temporary container to parse the HTML
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = postHTML; // Insert the fetched HTML into the temp div

        // Extract the content inside <main> and the specific class 'featured-post'
        const postContent = tempDiv.querySelector('main .featured-post');

        // Find the 'featured-post' container
        const featuredPost = document.getElementById("featured-post");

        // If postContent is found, inject it into the 'featured-post' container
        if (postContent) {
            featuredPost.innerHTML = postContent.innerHTML;

            // Get the folder names (first part: 'gear_reviews', second part: 'fuji_x100vi')
            const urlParts = mostRecentPost.url.split('/');
            const folderName1 = urlParts[0];  // First part ('gear_reviews')
            const folderName2 = urlParts[1];  // Second part ('fuji_x100vi')

            // Combine both folder names for image path
            const fullFolderPath = folderName1 + '/' + folderName2;

            // Find all images in the injected content and prepend the full folder path to both 'src' and 'data-full'
            const images = featuredPost.querySelectorAll('img');
            images.forEach(img => {
                const src = img.getAttribute('src');  // Get current image source
                const dataFull = img.getAttribute('data-full');  // Get the full-size image path

                // Prepend both folder names to the 'src' if it's relative
                if (src && !src.startsWith('http')) {
                    img.src = fullFolderPath + '/' + src;
                }

                // Prepend both folder names to 'data-full' if it's relative
                if (dataFull && !dataFull.startsWith('http')) {
                    img.setAttribute('data-full', fullFolderPath + '/' + dataFull);
                }
            });
        } else {
            featuredPost.innerHTML = 'Content not available';  // Handle case where content is missing
        }
    })
    .catch(error => console.error('Error loading the post content:', error));  // Handle any errors loading the post content




    


        // Dynamically populate the Sidebar
        const sidebar = document.getElementById("sidebar");
        let sidebarContent = '';

        // Group posts by category
        const categories = data.reduce((acc, post) => {
            if (!acc[post.category]) acc[post.category] = [];
            acc[post.category].push(post);
            return acc;
        }, {});

        // Create sidebar links for each category
        for (let category in categories) {
            sidebarContent += `<h5>${category}</h5><ul>`;
            categories[category].forEach(post => {
                sidebarContent += `<li><a href="${post.url}">${post.title}</a></li>`;
            });
            sidebarContent += '</ul>';
        }

        sidebar.innerHTML = sidebarContent;
    })
    .catch(error => console.error('Error loading posts:', error));










document.addEventListener("DOMContentLoaded", () => {
    const featuredPost = document.getElementById("featured-post");
    let currentIndex = -1;  // Global index for tracking image position

    // Listen for clicks on thumbnail images and open the lightbox
    featuredPost.addEventListener('click', function(e) {
        if (e.target.classList.contains('thumb')) {
            const clickedImage = e.target;
            const imgData = clickedImage.dataset;

            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');

            // Set the full image and caption
            lightboxImg.src = imgData.full;
            lightboxCaption.textContent = imgData.caption || "";

            // Show the lightbox
            document.getElementById('lightbox').style.display = 'flex';

            // Set the global current index for the clicked image
            const images = Array.from(document.querySelectorAll('.thumb'));
            currentIndex = images.indexOf(clickedImage); // Get the index of clicked image
        }
    });

    // Event listener for the close button or clicking outside
    document.body.addEventListener('click', function(e) {
        const lightbox = document.getElementById('lightbox');

        // Close the lightbox when clicking the close button
        if (e.target.classList.contains('close')) {
            lightbox.style.display = 'none';
        }
        // Close the lightbox when clicking outside the image area
        else if (e.target === lightbox) {
            lightbox.style.display = 'none';
        }
    });

    // Navigation buttons (prev/next) for cycling through images
    document.body.addEventListener('click', function(e) {
        const lightboxImg = document.getElementById('lightbox-img');
        const images = Array.from(document.querySelectorAll('.thumb'));

        // Handle previous button click
        if (e.target.classList.contains('lightbox-prev')) {
            // Decrease the current index, wrapping around if necessary
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        }

        // Handle next button click
        if (e.target.classList.contains('lightbox-next')) {
            // Increase the current index, wrapping around if necessary
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }
    });

    // Function to show image in the lightbox by index
    function showImage(index) {
        const images = Array.from(document.querySelectorAll('.thumb'));
        const imgData = images[index].dataset;

        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');

        lightboxImg.src = imgData.full;
        lightboxCaption.textContent = imgData.caption || "";

        document.getElementById('lightbox').style.display = 'flex';
    }
});

</script>
